<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRITZAAR/title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#1A1C1E; --card:#1E2124; --card2:#222528;
      --mint:#00FFC2; --slate:#9BA4B0; --white:#E8ECF0;
      --mint-glow:rgba(0,255,194,0.28); --mint-dim:rgba(0,255,194,0.07);
      --gold:#C9A227; --gold-dim:rgba(201,162,39,0.12); --gold-glow:rgba(201,162,39,0.28);
      --hub-tab-h:52px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--slate);font-family:'Rajdhani',sans-serif;overflow-x:hidden;}
    #cur{position:fixed;width:10px;height:10px;border-radius:50%;background:var(--mint);pointer-events:none;z-index:9999;top:0;left:0;box-shadow:0 0 14px var(--mint),0 0 30px var(--mint-glow);transition:width .2s,height .2s,opacity .35s;}
    #curRing{position:fixed;width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,255,194,0.35);pointer-events:none;z-index:9998;top:0;left:0;transition:opacity .35s;}
    body.gold-mode #cur{background:var(--gold);box-shadow:0 0 14px var(--gold),0 0 30px var(--gold-glow);}
    body.gold-mode #curRing{border-color:rgba(201,162,39,0.35);}
    /* Touch devices: hide custom cursor elements (JS also skips cursor setup) */
    @media(hover:none),(pointer:coarse),(pointer:none){
      #cur,#curRing{display:none!important;visibility:hidden!important;pointer-events:none!important;}
    }
    .grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,194,0.025)1px,transparent 1px),linear-gradient(90deg,rgba(0,255,194,0.025)1px,transparent 1px);background-size:64px 64px;z-index:0;pointer-events:none;}
    /* Ambient orbs — give glassmorphism blur something vivid to refract */
    .orb{position:fixed;border-radius:50%;filter:blur(50px);pointer-events:none;z-index:0;opacity:0.18;transform:translateZ(0);will-change:transform;}
    .orb-1{width:520px;height:520px;background:radial-gradient(circle,#00ffc2,transparent 70%);top:-160px;left:-120px;}
    .orb-2{width:480px;height:480px;background:radial-gradient(circle,#0066ff,transparent 70%);bottom:-140px;right:-100px;}
    .orb-3{width:360px;height:360px;background:radial-gradient(circle,#c9a227,transparent 70%);top:40%;left:55%;opacity:0.09;}
    .krz-bar{position:relative;z-index:1;padding:52px 52px 40px;border-bottom:1px solid rgba(0,255,194,0.055);display:flex;align-items:flex-end;justify-content:space-between;}
    .krz-wordmark{font-family:'Orbitron',sans-serif;font-size:clamp(36px,6vw,80px);font-weight:900;color:var(--white);letter-spacing:-2px;line-height:1;}
    .krz-wordmark .ac{color:var(--mint);text-shadow:0 0 24px var(--mint),0 0 60px var(--mint-glow);}
    .krz-meta{text-align:right;}
    .krz-meta p{font-size:10px;letter-spacing:5px;color:var(--slate);text-transform:uppercase;margin-bottom:8px;}
    .krz-meta a{font-size:10px;letter-spacing:4px;color:var(--mint);text-decoration:none;text-transform:uppercase;border-bottom:1px solid rgba(0,255,194,0.3);padding-bottom:2px;transition:border-color .25s;}
    .krz-meta a:hover{border-color:var(--mint);}
    .hub{position:relative;z-index:1;}
    .hub-tabbar{position:sticky;top:0;z-index:700;height:var(--hub-tab-h);display:flex;align-items:center;padding:0 52px;background:rgba(26,28,30,0.96);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,255,194,0.055);gap:0;overflow-x:auto;scrollbar-width:none;will-change:transform;}
    .hub-tabbar::-webkit-scrollbar{display:none;}
    .htab{padding:0 18px;height:100%;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--slate);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;transition:color .22s,border-color .22s;}
    .htab:hover{color:var(--mint);}
    .htab.active{color:var(--mint);border-bottom-color:var(--mint);}
    .htab.gold-tab{color:rgba(201,162,39,0.6);}
    .htab.gold-tab:hover{color:var(--gold);}
    .htab.gold-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
    .panel-hdr{padding:36px 52px 24px;display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(255,255,255,0.035);}
    .panel-name{font-family:'Orbitron',sans-serif;font-size:clamp(22px,3vw,38px);font-weight:900;color:var(--white);letter-spacing:4px;text-transform:uppercase;}
    .panel-name.gold-head{color:var(--gold);text-shadow:0 0 20px var(--gold-glow);}
    .panel-count{font-size:10px;letter-spacing:4px;color:var(--slate);text-transform:uppercase;}
    .pol-banner{margin:0 52px 0;padding:14px 20px;border:1px solid rgba(201,162,39,0.25);background:rgba(201,162,39,0.04);display:none;align-items:center;gap:14px;}
    .pol-banner.visible{display:flex;}
    .pol-banner-icon{font-size:16px;flex-shrink:0;}
    .pol-banner p{font-size:11px;letter-spacing:1.5px;color:rgba(201,162,39,0.75);line-height:1.6;}
    .pol-banner strong{color:var(--gold);}
    .feed-panel{display:none;padding:32px 52px 0;}
    .feed-panel.active{display:block !important;}
    .feed-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:420px;gap:20px;margin-bottom:48px;}
    /* ══ CARD — phantom glass (no backdrop-filter = zero scroll tax) ══ */
    .card{
      position:relative;
      display:flex;flex-direction:column;
      height:100%;
      border-radius:16px;
      overflow:hidden;
      /* Phantom Glass: dark opaque base that mimics blurred dark bg.
         The actual glass illusion comes from borders + inset shadows below — not blur. */
      background:linear-gradient(
        145deg,
        rgba(42,46,50,0.97) 0%,
        rgba(30,33,36,0.97) 50%,
        rgba(36,40,44,0.97) 100%
      );
      /* Silver border — visible on all sides, brighter on top */
      border:1px solid rgba(180,200,220,0.38);
      box-shadow:
        /* Inner edge highlights simulate glass thickness */
        inset 0 1.5px 0 rgba(255,255,255,0.55),
        inset 0 -1px 0 rgba(0,0,0,0.25),
        inset 1px 0 0 rgba(255,255,255,0.18),
        inset -1px 0 0 rgba(255,255,255,0.10),
        /* Outer depth */
        0 8px 32px rgba(0,0,0,0.55),
        0 2px 8px rgba(0,0,0,0.3),
        /* Subtle outer silver rim glow */
        0 0 0 0.5px rgba(180,200,220,0.15);
      contain:layout style paint;
      content-visibility:auto;
      contain-intrinsic-size:auto 420px;
      will-change:transform;
      transition:transform .28s cubic-bezier(.25,.46,.45,.94),box-shadow .28s ease,border-color .24s;
    }
    /* Top-edge shine streak — bright silver specular */
    .card::before{
      content:'';position:absolute;top:0;left:5%;right:5%;height:1px;z-index:5;pointer-events:none;
      background:linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,0.4) 20%,
        rgba(255,255,255,0.75) 45%,
        rgba(255,255,255,0.85) 50%,
        rgba(255,255,255,0.75) 55%,
        rgba(255,255,255,0.4) 80%,
        transparent 100%);
    }
    /* Left-edge glass reflection streak */
    .card::after{
      content:'';position:absolute;top:5%;bottom:5%;left:0;width:1px;z-index:5;pointer-events:none;
      background:linear-gradient(180deg,
        transparent 0%,
        rgba(255,255,255,0.2) 25%,
        rgba(255,255,255,0.35) 50%,
        rgba(255,255,255,0.2) 75%,
        transparent 100%);
    }
    .card:hover{
      transform:translateY(-7px);
      border-color:rgba(200,220,240,0.65);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.7),
        inset 0 -1px 0 rgba(0,0,0,0.2),
        inset 1px 0 0 rgba(255,255,255,0.28),
        inset -1px 0 0 rgba(255,255,255,0.14),
        0 24px 60px rgba(0,0,0,0.65),
        0 8px 24px rgba(0,0,0,0.35),
        0 0 0 0.5px rgba(200,220,240,0.3),
        0 0 48px rgba(0,255,194,0.07);
    }
    .card.card-gold{border-color:rgba(201,162,39,0.45);box-shadow:inset 0 1.5px 0 rgba(255,215,100,0.45),inset 1px 0 0 rgba(255,215,100,0.15),0 8px 32px rgba(0,0,0,0.45),0 0 0 0.5px rgba(201,162,39,0.18);}
    .card.card-gold:hover{border-color:rgba(201,162,39,0.72);box-shadow:inset 0 1.5px 0 rgba(255,215,100,0.65),inset 1px 0 0 rgba(255,215,100,0.22),0 24px 60px rgba(0,0,0,0.6),0 0 0 0.5px rgba(201,162,39,0.35),0 0 40px rgba(201,162,39,0.1);}
    .card-game{border-color:rgba(168,85,247,0.42)!important;box-shadow:inset 0 1.5px 0 rgba(200,150,255,0.42),inset 1px 0 0 rgba(200,150,255,0.14),0 8px 32px rgba(0,0,0,0.45),0 0 0 0.5px rgba(168,85,247,0.18)!important;}
    .card-game:hover{border-color:rgba(168,85,247,0.72)!important;box-shadow:inset 0 1.5px 0 rgba(200,150,255,0.6),inset 1px 0 0 rgba(200,150,255,0.22),0 24px 60px rgba(0,0,0,0.6),0 0 0 0.5px rgba(168,85,247,0.32),0 0 40px rgba(168,85,247,0.1)!important;}

    /* ── Image section ── */
    .card-thumb{
      position:relative;width:100%;height:260px;flex-shrink:0;overflow:hidden;
      background:#0d0f11;border-radius:14px 14px 0 0;
    }
    .card-thumb-blur{
      position:absolute;inset:-10px;
      background-size:cover;background-position:center;
      filter:blur(14px) brightness(0.45) saturate(1.2);
      transform:scale(1.05) translateZ(0);transition:filter .5s ease;
      will-change:filter,transform;
    }
    .card:hover .card-thumb-blur{filter:blur(12px) brightness(0.5) saturate(1.3);}
    .card-thumb-inner{
      position:relative;z-index:1;width:100%;height:100%;
      display:flex;align-items:center;justify-content:center;
      transition:transform .5s cubic-bezier(.25,.46,.45,.94);
    }
    .card:hover .card-thumb-inner{transform:scale(1.04);}
    .card-thumb-inner img{width:100%;height:100%;object-fit:contain;display:block;}
    .card-thumb-inner.has-img{background:none;}
    .th-stories{background:linear-gradient(160deg,#0d2e1a 0%,#070e0c 100%);}
    .th-updates{background:linear-gradient(160deg,#0a1e38 0%,#050a10 100%);}
    .th-conflict{background:linear-gradient(160deg,#2a1408 0%,#0e0604 100%);}
    .th-fun{background:linear-gradient(160deg,#20083c 0%,#0a0310 100%);}
    .th-coolstuff{background:linear-gradient(160deg,#082428 0%,#020c0e 100%);}
    .th-ai{background:linear-gradient(160deg,#061828 0%,#020810 100%);}
    .th-interesting{background:linear-gradient(160deg,#082420 0%,#020c0a 100%);}
    .th-political{background:linear-gradient(160deg,#281c04 0%,#0c0901 100%);}
    .th-game{background:linear-gradient(160deg,#14083a 0%,#060310 100%);}
    .card-thumb-inner:not(.has-img)::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-52deg,transparent,transparent 22px,rgba(0,255,194,0.018) 22px,rgba(0,255,194,0.018) 23px);}
    .card-gold .card-thumb-inner:not(.has-img)::before{background:repeating-linear-gradient(-52deg,transparent,transparent 22px,rgba(201,162,39,0.02) 22px,rgba(201,162,39,0.02) 23px);}
    .card-game .card-thumb-inner:not(.has-img)::before{background:repeating-linear-gradient(-52deg,transparent,transparent 22px,rgba(168,85,247,0.025) 22px,rgba(168,85,247,0.025) 23px);}
    .card-num{position:absolute;bottom:12px;right:16px;font-family:'Orbitron',sans-serif;font-size:64px;font-weight:900;color:rgba(0,255,194,0.05);letter-spacing:-4px;line-height:1;user-select:none;}
    .game-play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(138,43,226,0.18);border:1.5px solid rgba(138,43,226,0.6);display:flex;align-items:center;justify-content:center;font-size:18px;z-index:3;transition:background .25s,transform .25s;}
    .card:hover .game-play-icon{background:rgba(138,43,226,0.3);transform:translate(-50%,-50%) scale(1.12);}

    /* ── Info panel — solid dark base (no backdrop-filter) ── */
    .card-body{
      flex:1;min-height:0;position:relative;padding:12px 16px 14px;
      background:linear-gradient(180deg,
        rgba(8,12,20,0.82) 0%,
        rgba(8,12,20,0.95) 100%
      );
      border-top:1px solid rgba(180,200,220,0.22);
      display:flex;flex-direction:column;overflow:hidden;
    }
    .card-body::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.22) 30%,rgba(255,255,255,0.38) 50%,rgba(255,255,255,0.22) 70%,transparent 100%);
      pointer-events:none;
    }

    /* ── HOVER PREVIEW OVERLAY — solid dark (no backdrop-filter) ── */
    .card-overlay{
      position:absolute;inset:0;z-index:20;
      background:rgba(6,10,16,0.95);
      border-radius:16px;
      padding:22px 20px 20px;
      display:flex;flex-direction:column;justify-content:flex-end;gap:0;
      /* Slide up from bottom */
      transform:translateY(100%) translateZ(0);
      opacity:0;
      transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .3s ease;
      pointer-events:none;
      will-change:transform,opacity;
      /* Inner top shine for overlay glass */
      border-top:1px solid rgba(255,255,255,0.1);
    }
    .card:hover .card-overlay{transform:translateY(0) translateZ(0);opacity:1;}
    /* Overlay top gradient fade */
    .card-overlay::before{
      content:'';position:absolute;top:0;left:0;right:0;height:80px;
      background:linear-gradient(to bottom,rgba(6,10,16,0.0),transparent);
      pointer-events:none;border-radius:16px 16px 0 0;
    }
    .ov-tag{font-family:'Rajdhani',sans-serif;font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--mint);margin-bottom:10px;}
    .card-gold .ov-tag{color:var(--gold);}
    .card-game .ov-tag{color:#A855F7;}
    .ov-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--white);line-height:1.5;letter-spacing:0.2px;margin-bottom:8px;}
    .ov-desc{font-family:'Rajdhani',sans-serif;font-size:12px;color:rgba(155,164,176,0.8);line-height:1.6;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
    .ov-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;margin-top:auto;}
    .ov-time{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(155,164,176,0.4);}
    .ov-cta{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--mint);display:flex;align-items:center;gap:5px;}
    .card-gold .ov-cta{color:var(--gold);}
    .card-game .ov-cta{color:#A855F7;}
    .ov-arr{display:inline-block;transition:transform .25s;}
    .card:hover .ov-arr{transform:translateX(4px);}

    /* Tag pill */
    .card-tag-pill{display:inline-block;font-family:'Rajdhani',sans-serif;font-size:8px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#0a0c0e;background:var(--mint);padding:3px 8px;border-radius:3px;margin-bottom:9px;line-height:1.5;align-self:flex-start;}
    .card-gold .card-tag-pill{background:var(--gold);}
    .card-game .card-tag-pill{background:#A855F7;color:#fff;}
    .card-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--white);line-height:1.45;letter-spacing:0.1px;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .card-desc{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:400;color:rgba(155,164,176,0.75);line-height:1.55;letter-spacing:0.2px;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
    .card-time{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(155,164,176,0.35);}
    .card-cta{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--mint);background:none;border:none;cursor:pointer;padding:0;transition:letter-spacing .25s;display:flex;align-items:center;gap:4px;}
    .card-cta .arr{display:inline-block;transition:transform .25s;}
    .card:hover .card-cta .arr{transform:translateX(4px);}
    .card-gold .card-cta{color:var(--gold);}
    .card-game .card-cta{color:#A855F7;}

    /* Game iframe modal */
    #gameModal{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,0.95);display:none;flex-direction:column;}
    #gameModal.show{display:flex;}
    .game-modal-bar{height:48px;background:rgba(22,24,26,0.98);border-bottom:1px solid rgba(138,43,226,0.2);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;}
    .game-modal-title{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:#A855F7;letter-spacing:3px;text-transform:uppercase;flex:1;}
    .game-modal-close{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--slate);background:none;border:1px solid rgba(155,164,176,0.2);padding:6px 16px;cursor:pointer;transition:color .2s,border-color .2s;}
    .game-modal-close:hover{color:var(--white);border-color:var(--slate);}
    .game-modal-fullscreen{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(138,43,226,0.6);background:none;border:1px solid rgba(138,43,226,0.2);padding:6px 16px;cursor:pointer;transition:color .2s,border-color .2s;}
    .game-modal-fullscreen:hover{color:#A855F7;border-color:rgba(138,43,226,0.5);}
    #gameFrame{flex:1;width:100%;border:none;background:#000;}
    .load-wrap{padding:0 52px 80px;display:flex;justify-content:center;}
    /* Load More button hidden — auto-load via IntersectionObserver sentinel */
    #loadBtn{display:none!important;}
    .load-btn{padding:14px 52px;border:1px solid rgba(0,255,194,0.25);background:none;color:var(--mint);font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;transition:color .3s;}
    .load-btn::before{content:'';position:absolute;inset:0;background:var(--mint);transform:translateX(-101%);transition:transform .35s cubic-bezier(.77,0,.175,1);z-index:-1;}
    .load-btn:hover{color:var(--bg);}
    .load-btn:hover::before{transform:translateX(0);}
    .load-btn.gold-btn{border-color:rgba(201,162,39,0.3);color:var(--gold);}
    .load-btn.gold-btn::before{background:var(--gold);}
    .status{position:fixed;bottom:28px;right:52px;z-index:500;font-size:9px;letter-spacing:3px;color:var(--slate);text-transform:uppercase;display:flex;align-items:center;gap:10px;}
    .s-dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:blink 1.6s ease-in-out infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.1}}
    /* Sentinel: invisible trigger element placed after last card row */
    .feed-sentinel{width:100%;height:1px;grid-column:1/-1;pointer-events:none;}
    /* Spinner shown while auto-loading */
    .auto-loading{display:flex;align-items:center;justify-content:center;gap:10px;
      padding:32px 0;grid-column:1/-1;font-size:9px;letter-spacing:3px;
      color:rgba(155,164,176,0.35);text-transform:uppercase;}
    .auto-loading .s-dot{animation:blink 1s ease-in-out infinite;}
    #polModal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.82);display:none;align-items:center;justify-content:center;}
    #polModal.show{display:flex;}
    .pol-box{background:#1C1D20;border:1px solid var(--gold);max-width:480px;width:90%;padding:44px 40px 40px;text-align:center;box-shadow:0 0 60px rgba(201,162,39,0.12);position:relative;}
    .pol-icon{font-size:28px;margin-bottom:18px;color:var(--gold);}
    .pol-box h3{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:7px;text-transform:uppercase;margin-bottom:18px;}
    .pol-box p{font-size:13px;letter-spacing:1px;color:var(--slate);line-height:1.75;margin-bottom:10px;}
    .pol-box .pol-disclaimer{font-size:10px;letter-spacing:2px;color:rgba(155,164,176,0.5);margin-bottom:32px;}
    .pol-confirm{padding:13px 36px;border:1px solid var(--gold);background:none;color:var(--gold);font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;transition:color .28s;}
    .pol-confirm::before{content:'';position:absolute;inset:0;background:var(--gold);transform:translateX(-101%);transition:transform .35s cubic-bezier(.77,0,.175,1);z-index:-1;}
    .pol-confirm:hover{color:var(--bg);}
    .pol-confirm:hover::before{transform:translateX(0);}
    .pol-cancel{margin-top:14px;display:block;font-size:10px;letter-spacing:3px;color:rgba(155,164,176,0.4);text-transform:uppercase;cursor:pointer;background:none;border:none;transition:color .25s;}
    .pol-cancel:hover{color:var(--slate);}
    /* Loading overlay */
    #loadingOverlay{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s;}
    #loadingOverlay.fade{opacity:0;pointer-events:none;}
    .load-logo{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;color:var(--white);letter-spacing:-1px;}
    .load-logo span{color:var(--mint);}
    .load-bar-wrap{width:200px;height:1px;background:rgba(0,255,194,0.1);}
    .load-bar{height:1px;background:var(--mint);width:0;animation:loadprog 1.5s ease-out forwards;box-shadow:0 0 8px var(--mint);}
    @keyframes loadprog{to{width:100%}}
    .load-msg{font-size:9px;letter-spacing:4px;color:var(--slate);text-transform:uppercase;}
    /* ══ SCROLL VELOCITY — fast-scroll mode kills hover tax ══
       JS adds .fast-scroll to body when scroll speed > threshold.
       During fast scroll: no hover lifts, no overlays, no pointer events on cards.
       This makes mid-scroll GPU load near zero. ══ */
    body.fast-scroll .card{
      pointer-events:none;
      transition:none;
    }
    body.fast-scroll .card-overlay{
      display:none;
    }
    body.fast-scroll .card:hover{
      transform:none;
    }
    /* ── PANEL SUB-SECTION TABBAR (level 1) ── */
    .panel-subsec-bar{display:flex;align-items:center;gap:0;padding:0 52px;background:rgba(26,28,30,0.55);border-bottom:1px solid rgba(0,255,194,0.04);overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;}
    .panel-subsec-bar::-webkit-scrollbar{display:none;}
    .pssb{padding:10px 16px;background:none;border:none;border-bottom:2px solid transparent;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--slate);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:color .22s,border-color .22s;display:flex;align-items:center;gap:6px;}
    .pssb:hover{color:var(--mint);}
    .pssb.active{color:var(--mint);border-bottom-color:var(--mint);}
    .pssb-count{font-size:8px;letter-spacing:1px;color:rgba(155,164,176,0.35);font-weight:400;}
    .pssb.active .pssb-count{color:rgba(0,255,194,0.4);}
    body.gold-mode .pssb:hover{color:var(--gold);}
    body.gold-mode .pssb.active{color:var(--gold);border-bottom-color:var(--gold);}
    body.gold-mode .pssb.active .pssb-count{color:rgba(201,162,39,0.45);}
    /* ── PANEL SUB-SUB-SECTION TABBAR (level 2) ── */
    .panel-subsubsec-bar{display:none;align-items:center;gap:0;padding:0 52px 0 68px;background:rgba(26,28,30,0.3);border-bottom:1px solid rgba(0,255,194,0.03);border-left:3px solid rgba(0,255,194,0.1);overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;}
    .panel-subsubsec-bar.visible{display:flex;}
    .panel-subsubsec-bar::-webkit-scrollbar{display:none;}
    .psssb{padding:8px 14px;background:none;border:none;border-bottom:2px solid transparent;font-family:'Rajdhani',sans-serif;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(155,164,176,0.55);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:color .22s,border-color .22s;display:flex;align-items:center;gap:6px;}
    .psssb:hover{color:var(--mint);}
    .psssb.active{color:var(--mint);border-bottom-color:var(--mint);}
    .psssb-count{font-size:7px;letter-spacing:1px;color:rgba(155,164,176,0.3);font-weight:400;}
    .psssb.active .psssb-count{color:rgba(0,255,194,0.35);}
    body.gold-mode .psssb:hover{color:var(--gold);}
    body.gold-mode .psssb.active{color:var(--gold);border-bottom-color:var(--gold);}
    @media(max-width:900px){.panel-subsec-bar,.panel-subsubsec-bar{padding:0 24px;}}
    @media(max-width:580px){.panel-subsec-bar,.panel-subsubsec-bar{padding:0 16px;}.pssb{padding:8px 12px;font-size:9px;}.psssb{padding:6px 10px;font-size:8px;}}

    /* Responsive */
    @media(max-width:1100px){.feed-grid{grid-template-columns:repeat(3,1fr);grid-auto-rows:400px;gap:16px;}}
    @media(max-width:900px){.feed-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:380px;gap:14px;}.krz-bar,.panel-hdr,.feed-panel,.load-wrap,.pol-banner{padding-left:24px;padding-right:24px;}.hub-tabbar{padding:0 24px;}}
    @media(max-width:580px){.feed-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:300px;gap:10px;}.card-thumb{height:180px!important;}.krz-bar{padding:28px 20px 24px;flex-direction:column;align-items:flex-start;gap:12px;}.krz-meta{text-align:left;}.krz-wordmark{font-size:clamp(32px,10vw,56px);}.panel-hdr{padding:20px 20px 16px;}.feed-panel,.load-wrap,.pol-banner{padding-left:16px;padding-right:16px;}.hub-tabbar{padding:0 16px;}.htab{padding:0 12px;font-size:10px;letter-spacing:1.5px;}.card-title{font-size:11px;}.status{bottom:16px;right:20px;font-size:8px;}.card-desc{display:none;}.card-body{padding:10px 12px 12px;}}
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loadingOverlay">
    <div class="load-logo">KRITZ<span>A</span>AR</div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
    <div class="load-msg">Loading content…</div>
  </div>

  <div id="cur"></div>
  <div id="curRing"></div>
  <div class="grid-bg"></div>
  <div class="status"><div class="s-dot"></div><span>LIVE — HUB</span></div>

  <div class="krz-bar">
    <h1 class="krz-wordmark">KRITZ<span class="ac">A</span>AR</h1>
    <div class="krz-meta">
      <p>Dark-mode content hub</p>
      <a href="#">↑ Begin the climb</a>
    </div>
  </div>

  <div class="hub" id="hub">
    <div class="hub-tabbar" id="tabBar"></div>
    <div class="panel-hdr">
      <h2 class="panel-name" id="panelName">Loading…</h2>
      <span class="panel-count" id="panelCount"></span>
    </div>
    <div class="pol-banner" id="polBanner">
      <div class="pol-banner-icon">⚠</div>
      <p><strong>Non-Suggested Content.</strong> This section contains political news. KRITZAAR does not promote or endorse any political position.</p>
    </div>
    <div id="panelsContainer"></div>
    <div class="load-wrap">
      <button class="load-btn" id="loadBtn">Load More</button>
    </div>
  </div>

  <!-- Game iframe modal -->
  <div id="gameModal">
    <div class="game-modal-bar">
      <span class="game-modal-title" id="gameModalTitle">Game</span>
      <button class="game-modal-fullscreen" onclick="document.getElementById('gameFrame').requestFullscreen()">⛶ Fullscreen</button>
      <button class="game-modal-close" onclick="closeGame()">✕ Close</button>
    </div>
    <iframe id="gameFrame" src="" allowfullscreen allow="fullscreen"></iframe>
  </div>

  <div id="polModal">
    <div class="pol-box">
      <div class="pol-icon">⚠</div>
      <h3>Political Section</h3>
      <p>This section contains political news and analysis. KRITZAAR does not suggest, promote, or endorse any political party, candidate, or ideology.</p>
      <p class="pol-disclaimer">Content is presented for informational purposes only.</p>
      <button class="pol-confirm" id="polConfirm">I Understand — Show Content</button>
      <button class="pol-cancel" id="polCancel">Go Back</button>
    </div>
  </div>

  <script>
    /* ════════════════════════════════════════════
       VIEWER CONFIG — set your GitHub info here
       Replace with YOUR username, repo, and file path
    ════════════════════════════════════════════ */
    const GITHUB_USER = 'kartikmanarse18-lgtm';
    const GITHUB_REPO = 'KritZaar';
    const GITHUB_FILE = 'feeds.json'; // legacy fallback path

    // Base raw URL — folder prefix derived from GITHUB_FILE
    const _folder = GITHUB_FILE.includes('/') ? GITHUB_FILE.replace(/\/[^/]+$/, '') : '';
    const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${_folder ? _folder + '/' : ''}`;
    const RAW_LEGACY = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${GITHUB_FILE}`;

    /* ════════════════════════════════════════════
       FETCH FEEDS — split files + legacy fallback
    ════════════════════════════════════════════ */
    let FEEDS = {};
    let currentTab = '';
    let polConfirmed = false;

    // How many cards to show per "page" (initial + each Load More click)
    const PAGE_SIZE = 8;
    // Tracks how many cards are currently shown per tab
    const tabPage = {};
    // Tracks which section JSONs have been fetched
    const sectionFetched = {};
    // Tracks active sub-section per section (null = main section cards)
    const subTabState = {};
    // Tracks active sub-sub-section per "sectionId/subId" key
    const subSubTabState = {};

    async function fetchSection(id) {
      if (sectionFetched[id]) return; // already loaded
      sectionFetched[id] = true;
      const bust = '?t=' + Date.now();
      try {
        const r = await fetch(RAW_BASE + id + '.json' + bust);
        if (!r.ok) throw new Error('Section "' + id + '" not found');
        const data = await r.json();
        if (FEEDS[id]) {
          FEEDS[id].cards = data.cards || [];
          if (data.subsections) FEEDS[id].subsections = data.subsections;
        }
      } catch(e) {
        sectionFetched[id] = false; // FIX: allow retry — don't permanently lock out
        console.warn('[KRITZAAR] Could not load section:', id, e);
        if (FEEDS[id]) FEEDS[id].cards = [];
      }
    }

    async function loadFeeds() {
      const bust = '?t=' + Date.now();
      try {
        // Try new split format: _index.json first
        const idxRes = await fetch(RAW_BASE + '_index.json' + bust);

        if (idxRes.ok) {
          const index = await idxRes.json();
          if (index._theme) applyTheme(index._theme);
          const sectionIds = Object.keys(index.sections || {});
          // Populate FEEDS with meta only (cards = [] placeholder)
          FEEDS = {};
          for (const id of sectionIds) {
            FEEDS[id] = { ...index.sections[id], cards: [] };
          }
          // Only fetch the FIRST section eagerly; rest are lazy on tab click
          if (sectionIds.length > 0) {
            await fetchSection(sectionIds[0]);
          }
        } else {
          // Legacy fallback: single feeds.json (all cards in one file — load all)
          const res = await fetch(RAW_LEGACY + bust);
          if (!res.ok) throw new Error('Not found');
          FEEDS = await res.json();
          // Mark all as fetched in legacy mode
          Object.keys(FEEDS).forEach(id => { sectionFetched[id] = true; });
        }
        return true;
      } catch(e) {
        document.getElementById('loadingOverlay').innerHTML = `
          <div style="text-align:center;padding:40px">
            <div class="load-logo">kritzaar<span>A</span>AR</div>
            <p style="margin-top:24px;font-size:11px;letter-spacing:3px;color:var(--slate);text-transform:uppercase;line-height:2">
              Content not found.<br>Check your GitHub settings in admin.
            </p>
            <p style="margin-top:12px;font-size:10px;color:rgba(155,164,176,0.4);letter-spacing:2px">
              ${RAW_BASE}_index.json
            </p>
          </div>`;
        return false;
      }
    }

    function applyTheme(t) {
      if (!t) return;
      const s = document.documentElement.style;
      const toRgba = (hex, a) => { const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return `rgba(${r},${g},${b},${(+a).toFixed(3)})`; };
      if (t.accent) { s.setProperty('--mint', t.accent); s.setProperty('--mint-glow', toRgba(t.accent,(t.glowIntensity||28)/100)); s.setProperty('--mint-dim', toRgba(t.accent,0.07)); }
      if (t.bg)     s.setProperty('--bg', t.bg);
      if (t.card)   { s.setProperty('--card', t.card); s.setProperty('--card2', t.card); }
      if (t.gold)   { s.setProperty('--gold', t.gold); s.setProperty('--gold-glow', toRgba(t.gold,0.28)); s.setProperty('--gold-dim', toRgba(t.gold,0.12)); }
      if (t.slate)  s.setProperty('--slate', t.slate);
      if (t.white)  s.setProperty('--white', t.white);
      if (t.accent && t.gridOpacity !== undefined) {
        const a = (t.gridOpacity||2)/100;
        document.querySelectorAll('.grid-bg').forEach(el => {
          el.style.backgroundImage = `linear-gradient(${toRgba(t.accent,a)}1px,transparent 1px),linear-gradient(90deg,${toRgba(t.accent,a)}1px,transparent 1px)`;
        });
      }
      // Re-apply GSAP glow with new accent
      if (t.accent && typeof gsap !== 'undefined') {
        gsap.killTweensOf('.krz-wordmark .ac');
        gsap.to('.krz-wordmark .ac', {textShadow:`0 0 36px ${t.accent},0 0 80px ${toRgba(t.accent,0.5)}`,duration:2.2,ease:'power2.inOut',repeat:-1,yoyo:true});
      }
    }

    function buildCards(tabId, isGold, limit, cardsOverride) {
      const cards = cardsOverride !== undefined ? cardsOverride : FEEDS[tabId].cards;
      const slice = (limit != null) ? cards.slice(0, limit) : cards;
      return slice.map((c, i) => {
        const isGame = c.type === 'game';
        const hasImg = c.image && c.image.trim() !== '';
        const imgPos = `object-position:${c.imagePosX??50}% ${c.imagePosY??50}%`;

        // Blur bg layer only when there's an image
        const blurBg = hasImg
          ? `<div class="card-thumb-blur" style="background-image:url('${escHtml(c.image)}')"></div>`
          : '';

        const thumbInner = hasImg
          ? `<div class="card-thumb-inner has-img"><img src="${escHtml(c.image)}" alt="${escHtml(c.title)}" loading="lazy" onerror="this.closest('.card-thumb').querySelector('.card-thumb-blur')?.remove();this.style.objectFit='cover'"></div>`
          : `<div class="card-thumb-inner ${isGame ? 'th-game' : 'th-'+tabId}"><div class="card-num">${String(i+1).padStart(2,'0')}</div>${isGame ? '<div class="game-play-icon">▶</div>' : ''}</div>`;

        const clickAttr = isGame
          ? `onclick="openGame('${escHtml(c.url)}','${escHtml(c.title)}')"` 
          : (c.url ? `onclick="window.open('${escHtml(c.url)}','_blank')"` : '');

        const cardClass = `card ${isGold?'card-gold':''} ${isGame?'card-game':''}`.trim();
        const ctaLabel = isGame ? 'Play' : (c.url ? 'Read' : 'Soon');
        const timeLabel = isGame ? '◈ Interactive' : (c.time ? c.time + ' read' : '');
        const desc = c.desc || c.description || '';
        const tagLabel = isGame ? '◈ GAME' : escHtml(c.tag);

        return `
          <div class="${cardClass}" ${clickAttr}>
            <div class="card-thumb">
              ${blurBg}
              ${thumbInner}
            </div>
            <div class="card-body">
              <span class="card-tag-pill">${tagLabel}</span>
              <h3 class="card-title">${escHtml(c.title)}</h3>
              ${desc ? `<p class="card-desc">${escHtml(desc)}</p>` : ''}
              <div class="card-footer">
                <span class="card-time">${timeLabel}</span>
                <button class="card-cta">${ctaLabel} <span class="arr">→</span></button>
              </div>
            </div>
            <!-- Hover overlay: shows full article preview on cursor enter -->
            <div class="card-overlay">
              <div class="ov-tag">${tagLabel}</div>
              <div class="ov-title">${escHtml(c.title)}</div>
              ${desc ? `<div class="ov-desc">${escHtml(desc)}</div>` : ''}
              <div class="ov-footer">
                <span class="ov-time">${timeLabel}</span>
                <span class="ov-cta">${ctaLabel} <span class="ov-arr">→</span></span>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function escHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function buildUI() {
      const tabBar = document.getElementById('tabBar');
      const container = document.getElementById('panelsContainer');
      tabBar.innerHTML = '';
      container.innerHTML = '';
      const ids = Object.keys(FEEDS);

      ids.forEach((id, idx) => {
        const f = FEEDS[id];
        // Tab button
        const btn = document.createElement('button');
        btn.className = 'htab' + (f.isGold?' gold-tab':'') + (idx===0?' active':'');
        btn.dataset.tab = id;
        btn.textContent = (f.isGold ? '⚠ ' : '') + f.label;
        btn.addEventListener('click', () => switchTab(id));
        tabBar.appendChild(btn);

        // Panel
        const panel = document.createElement('div');
        panel.id = 'panel-' + id;
        panel.className = 'feed-panel' + (idx===0?' active':'');

        // Sub-section tabbar — only render if this section is already fetched (idx===0).
        // For lazy sections, the sub-bar is injected in switchTab after fetch completes.
        const subsecs = (idx === 0) ? (f.subsections || {}) : {};
        const subKeys = Object.keys(subsecs);
        if (subKeys.length > 0) {
          const subBar = document.createElement('div');
          subBar.className = 'panel-subsec-bar';
          subBar.id = 'subbar-' + id;

          const mainBtn = document.createElement('button');
          mainBtn.className = 'pssb active';
          mainBtn.dataset.sub = '__main__';
          mainBtn.innerHTML = `Main <span class="pssb-count">${f.cards.length}</span>`;
          mainBtn.addEventListener('click', () => switchSubTab(id, '__main__'));
          subBar.appendChild(mainBtn);

          subKeys.forEach(subId => {
            const sub = subsecs[subId];
            const subBtn = document.createElement('button');
            subBtn.className = 'pssb';
            subBtn.dataset.sub = subId;
            subBtn.innerHTML = `${escHtml(sub.label)} <span class="pssb-count">${(sub.cards||[]).length}</span>`;
            subBtn.addEventListener('click', () => switchSubTab(id, subId));
            subBar.appendChild(subBtn);
          });
          panel.appendChild(subBar);

          // Build level-2 sub-sub-section bar (initially hidden)
          const subSubBar = document.createElement('div');
          subSubBar.className = 'panel-subsubsec-bar';
          subSubBar.id = 'subsubbar-' + id;
          panel.appendChild(subSubBar);
        }

        const grid = document.createElement('div');
        grid.className = 'feed-grid';
        panel.appendChild(grid);

        if (idx === 0) {
          tabPage[id] = PAGE_SIZE;
          grid.innerHTML = buildCards(id, f.isGold, PAGE_SIZE);
        } else {
          panel.dataset.unrendered = '1';
        }
        container.appendChild(panel);
      });

      currentTab = ids[0];
      const first = FEEDS[currentTab];
      document.getElementById('panelName').textContent = first.label;
      document.getElementById('panelCount').textContent = first.count;
      // Place sentinel for the first panel
      const firstGrid = document.querySelector('#panel-'+currentTab+' .feed-grid');
      if (firstGrid) placeSentinel(firstGrid, currentTab);
    }

    /* ════════════════════════════════════════════
       SUB-SECTION SWITCHING (viewer) — handles level-1 and level-2
    ════════════════════════════════════════════ */
    function switchSubTab(sectionId, subId) {
      subTabState[sectionId] = subId;
      // Reset level-2 state when switching level-1
      delete subSubTabState[sectionId + '/' + subId];
      const isGold = FEEDS[sectionId]?.isGold;

      // Update active state on level-1 tabs
      const subBar = document.getElementById('subbar-' + sectionId);
      if (subBar) {
        subBar.querySelectorAll('.pssb').forEach(b => b.classList.toggle('active', b.dataset.sub === subId));
      }

      // Build / update level-2 sub-sub bar
      const subSubBar = document.getElementById('subsubbar-' + sectionId);
      if (subSubBar) {
        subSubBar.innerHTML = '';
        if (subId !== '__main__') {
          const subObj = FEEDS[sectionId]?.subsections?.[subId];
          const subsubsecs = subObj?.subsections || {};
          const subsubKeys = Object.keys(subsubsecs);
          if (subsubKeys.length > 0) {
            subSubBar.classList.add('visible');
            // "Back to sub" button
            const backBtn = document.createElement('button');
            backBtn.className = 'psssb active';
            backBtn.dataset.subsub = '__sub__';
            backBtn.innerHTML = `◦ ${escHtml(subObj.label)} <span class="psssb-count">${(subObj.cards||[]).length}</span>`;
            backBtn.addEventListener('click', () => switchSubSubTab(sectionId, subId, '__sub__'));
            subSubBar.appendChild(backBtn);
            subsubKeys.forEach(ssid => {
              const ssObj = subsubsecs[ssid];
              const ssBtn = document.createElement('button');
              ssBtn.className = 'psssb';
              ssBtn.dataset.subsub = ssid;
              ssBtn.innerHTML = `${escHtml(ssObj.label)} <span class="psssb-count">${(ssObj.cards||[]).length}</span>`;
              ssBtn.addEventListener('click', () => switchSubSubTab(sectionId, subId, ssid));
              subSubBar.appendChild(ssBtn);
            });
          } else {
            subSubBar.classList.remove('visible');
          }
        } else {
          subSubBar.classList.remove('visible');
        }
      }

      // Determine cards to show at level-1
      const f = FEEDS[sectionId];
      const cards = subId === '__main__' ? (f.cards || []) : (f.subsections?.[subId]?.cards || []);

      const grid = document.querySelector('#panel-' + sectionId + ' .feed-grid');
      if (!grid) return;

      if (sentinelObserver) sentinelObserver.disconnect();
      grid.querySelectorAll('.feed-sentinel,.auto-loading').forEach(el => el.remove());

      if (subId === '__main__') {
        tabPage[sectionId] = PAGE_SIZE;
        grid.innerHTML = buildCards(sectionId, isGold, PAGE_SIZE);
        const newCards = Array.from(grid.querySelectorAll('.card'));
        gsap.fromTo(newCards, {y:16,opacity:0}, {y:0,opacity:1,duration:.3,ease:'power2.out',stagger:.04});
        placeSentinel(grid, sectionId);
      } else {
        grid.innerHTML = buildCards(sectionId, isGold, null, cards);
        tabPage[sectionId] = cards.length;
        const newCards = Array.from(grid.querySelectorAll('.card'));
        gsap.fromTo(newCards, {y:16,opacity:0}, {y:0,opacity:1,duration:.3,ease:'power2.out',stagger:.04});
      }
    }

    function switchSubSubTab(sectionId, subId, subsubId) {
      subSubTabState[sectionId + '/' + subId] = subsubId;
      const isGold = FEEDS[sectionId]?.isGold;

      // Update active state on level-2 bar
      const subSubBar = document.getElementById('subsubbar-' + sectionId);
      if (subSubBar) {
        subSubBar.querySelectorAll('.psssb').forEach(b => b.classList.toggle('active', b.dataset.subsub === subsubId));
      }

      const f = FEEDS[sectionId];
      const subObj = f?.subsections?.[subId];
      const cards = subsubId === '__sub__'
        ? (subObj?.cards || [])
        : (subObj?.subsections?.[subsubId]?.cards || []);

      const grid = document.querySelector('#panel-' + sectionId + ' .feed-grid');
      if (!grid) return;

      if (sentinelObserver) sentinelObserver.disconnect();
      grid.querySelectorAll('.feed-sentinel,.auto-loading').forEach(el => el.remove());
      grid.innerHTML = buildCards(sectionId, isGold, null, cards);
      tabPage[sectionId] = cards.length;
      const newCards = Array.from(grid.querySelectorAll('.card'));
      gsap.fromTo(newCards, {y:16,opacity:0}, {y:0,opacity:1,duration:.3,ease:'power2.out',stagger:.04});
    }

    // ── Sentinel / auto-load ──────────────────────────────────────────
    let sentinel = null;
    let sentinelObserver = null;

    function placeSentinel(grid, tabId) {
      // Remove any existing sentinel
      grid.querySelectorAll('.feed-sentinel,.auto-loading').forEach(el => el.remove());
      const total = FEEDS[tabId]?.cards?.length || 0;
      const shown = tabPage[tabId] || 0;
      if (shown >= total) return; // all loaded — no sentinel needed

      // Invisible div watched by IntersectionObserver
      sentinel = document.createElement('div');
      sentinel.className = 'feed-sentinel';
      sentinel.dataset.tab = tabId;
      grid.appendChild(sentinel);

      if (sentinelObserver) sentinelObserver.disconnect();
      sentinelObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const tid = entry.target.dataset.tab;
          if (tid !== currentTab) return;
          autoLoadMore(tid, grid);
        });
      }, { rootMargin: '0px 0px 300px 0px', threshold: 0 });
      // Observe on next frame so it doesn't fire immediately
      requestAnimationFrame(() => {
        if (sentinel && sentinel.isConnected) sentinelObserver.observe(sentinel);
      });
    }

    function autoLoadMore(tabId, grid) {
      const feed = FEEDS[tabId];
      if (!feed) return;
      // Don't auto-load while a sub-section is active — sub-section cards are shown in full
      const activeSub2 = subTabState[tabId];
      if (activeSub2 && activeSub2 !== '__main__') return;
      // Also guard sub-sub-section level
      if (activeSub2 && subSubTabState[tabId + '/' + activeSub2]) return;
      const shown = tabPage[tabId] || 0;
      const total = feed.cards.length;
      if (shown >= total) {
        if (sentinelObserver) sentinelObserver.disconnect();
        grid.querySelectorAll('.feed-sentinel').forEach(el => el.remove());
        return;
      }

      // Disconnect while loading to prevent duplicate fires
      if (sentinelObserver) sentinelObserver.disconnect();

      // Show spinner
      const spinner = document.createElement('div');
      spinner.className = 'auto-loading';
      spinner.innerHTML = '<div class="s-dot"></div><span>Loading more…</span>';
      grid.appendChild(spinner);

      // Small delay so the spinner is visible briefly (avoids jarring pop)
      setTimeout(() => {
        spinner.remove();
        const next = Math.min(shown + PAGE_SIZE, total);
        const newBatch = feed.cards.slice(shown, next);
        const isGold = feed.isGold;
        const tmp = document.createElement('div');
        tmp.innerHTML = newBatch.map((c, i) => {
          const idx = shown + i;
          const isGame = c.type === 'game';
          const hasImg = c.image && c.image.trim() !== '';
          const blurBg = hasImg ? `<div class="card-thumb-blur" style="background-image:url('${escHtml(c.image)}')"></div>` : '';
          const thumbInner = hasImg
            ? `<div class="card-thumb-inner has-img"><img src="${escHtml(c.image)}" alt="${escHtml(c.title)}" loading="lazy"></div>`
            : `<div class="card-thumb-inner ${isGame ? 'th-game' : 'th-'+tabId}"><div class="card-num">${String(idx+1).padStart(2,'0')}</div>${isGame ? '<div class="game-play-icon">▶</div>' : ''}</div>`;
          const clickAttr = isGame ? `onclick="openGame('${escHtml(c.url)}','${escHtml(c.title)}')"` : (c.url ? `onclick="window.open('${escHtml(c.url)}','_blank')"` : '');
          const cardClass = `card ${isGold?'card-gold':''} ${isGame?'card-game':''}`.trim();
          const ctaLabel = isGame ? 'Play' : (c.url ? 'Read' : 'Soon');
          const timeLabel = isGame ? '◈ Interactive' : (c.time ? c.time + ' read' : '');
          const desc = c.desc || c.description || '';
          const tagLabel = isGame ? '◈ GAME' : escHtml(c.tag);
          return `<div class="${cardClass}" ${clickAttr}>
              <div class="card-thumb">${blurBg}${thumbInner}</div>
              <div class="card-body">
                <span class="card-tag-pill">${tagLabel}</span>
                <h3 class="card-title">${escHtml(c.title)}</h3>
                ${desc ? `<p class="card-desc">${escHtml(desc)}</p>` : ''}
                <div class="card-footer"><span class="card-time">${timeLabel}</span><button class="card-cta">${ctaLabel} <span class="arr">→</span></button></div>
              </div>
              <div class="card-overlay">
                <div class="ov-tag">${tagLabel}</div>
                <div class="ov-title">${escHtml(c.title)}</div>
                ${desc ? `<div class="ov-desc">${escHtml(desc)}</div>` : ''}
                <div class="ov-footer"><span class="ov-time">${timeLabel}</span><span class="ov-cta">${ctaLabel} <span class="ov-arr">→</span></span></div>
              </div>
            </div>`;
        }).join('');
        const newCards = Array.from(tmp.children);
        newCards.forEach(el => grid.appendChild(el));
        gsap.fromTo(newCards, {y:20,opacity:0}, {y:0,opacity:1,duration:.32,ease:'power2.out',stagger:.04});
        tabPage[tabId] = next;
        // Re-place sentinel if more cards remain
        placeSentinel(grid, tabId);
      }, 200);
    }

    // Keep updateLoadBtn as no-op (button is hidden, sentinel handles loading)
    function updateLoadBtn() {}

    function switchTab(tabId) {
      if (tabId === 'political' && FEEDS.political?.isGold && !polConfirmed) {
        document.getElementById('polModal').classList.add('show');
        return;
      }
      if (tabId === currentTab) return;

      const panel = document.getElementById('panel-'+tabId);
      const isGold = FEEDS[tabId]?.isGold;

      // If section not yet fetched, fetch it first then render
      if (panel.dataset.unrendered === '1') {
        const requestedTab = tabId; // FIX: capture at click time to guard against race condition
        fetchSection(tabId).then(() => {
          if (currentTab !== requestedTab) return; // FIX: user clicked another tab while fetching — abort
          delete panel.dataset.unrendered;
          tabPage[tabId] = PAGE_SIZE;
          const grid = panel.querySelector('.feed-grid');
          grid.innerHTML = buildCards(tabId, isGold, PAGE_SIZE);

          // Inject sub-section bar if section has subsections (loaded after fetch)
          const f = FEEDS[tabId];
          const subsecs = f.subsections || {};
          const subKeys = Object.keys(subsecs);
          if (subKeys.length > 0 && !document.getElementById('subbar-'+tabId)) {
            const subBar = document.createElement('div');
            subBar.className = 'panel-subsec-bar';
            subBar.id = 'subbar-' + tabId;
            const mainBtn = document.createElement('button');
            mainBtn.className = 'pssb active';
            mainBtn.dataset.sub = '__main__';
            mainBtn.innerHTML = `Main <span class="pssb-count">${f.cards.length}</span>`;
            mainBtn.addEventListener('click', () => switchSubTab(tabId, '__main__'));
            subBar.appendChild(mainBtn);
            subKeys.forEach(subId => {
              const sub = subsecs[subId];
              const subBtn = document.createElement('button');
              subBtn.className = 'pssb';
              subBtn.dataset.sub = subId;
              subBtn.innerHTML = `${escHtml(sub.label)} <span class="pssb-count">${(sub.cards||[]).length}</span>`;
              subBtn.addEventListener('click', () => switchSubTab(tabId, subId));
              subBar.appendChild(subBtn);
            });
            panel.insertBefore(subBar, grid);
            // Also inject the level-2 sub-sub bar placeholder
            if (!document.getElementById('subsubbar-' + tabId)) {
              const subSubBar = document.createElement('div');
              subSubBar.className = 'panel-subsubsec-bar';
              subSubBar.id = 'subsubbar-' + tabId;
              panel.insertBefore(subSubBar, grid);
            }
          } else if (!document.getElementById('subsubbar-' + tabId)) {
            // No level-1 subsections, but still create the subSubBar placeholder for consistency
            const subSubBar = document.createElement('div');
            subSubBar.className = 'panel-subsubsec-bar';
            subSubBar.id = 'subsubbar-' + tabId;
            panel.insertBefore(subSubBar, grid);
          }

          finishSwitch(tabId, panel, isGold);
          placeSentinel(grid, tabId);
        });
        // Show loading stub immediately
        currentTab = tabId;
        document.querySelectorAll('.feed-panel').forEach(p => {
          p.classList.remove('active');
          p.style.display = ''; // clear inline style
        });
        panel.classList.add('active');
        panel.querySelector('.feed-grid').innerHTML = '<p style="padding:48px;font-size:10px;letter-spacing:3px;color:rgba(155,164,176,0.3);text-transform:uppercase">Loading…</p>';
        document.querySelectorAll('.htab').forEach(b => b.classList.toggle('active', b.dataset.tab===tabId));
        const pn = document.getElementById('panelName');
        pn.textContent = FEEDS[tabId].label;
        pn.className = 'panel-name' + (isGold?' gold-head':'');
        document.getElementById('panelCount').textContent = FEEDS[tabId].count;
        document.getElementById('polBanner').classList.toggle('visible', !!isGold);
        document.getElementById('loadBtn').className = 'load-btn' + (isGold?' gold-btn':'');
        document.getElementById('loadBtn').style.display = 'none';
        document.getElementById('hub').scrollIntoView({behavior:'smooth',block:'start'});
        return;
      }

      currentTab = tabId;
      finishSwitch(tabId, panel, isGold);
    }

    function finishSwitch(tabId, panel, isGold) {
      document.body.classList.toggle('gold-mode', !!isGold);
      document.querySelectorAll('.htab').forEach(b => b.classList.toggle('active', b.dataset.tab===tabId));
      const pn = document.getElementById('panelName');
      pn.textContent = FEEDS[tabId].label;
      pn.className = 'panel-name' + (isGold?' gold-head':'');
      document.getElementById('panelCount').textContent = FEEDS[tabId].count;
      document.getElementById('polBanner').classList.toggle('visible', !!isGold);
      document.getElementById('loadBtn').className = 'load-btn' + (isGold?' gold-btn':'');
      document.querySelectorAll('.feed-panel').forEach(p => {
        p.classList.remove('active');
        p.style.display = ''; // FIX: clear inline style — let CSS class control visibility
      });
      panel.classList.add('active');

      // Reset sub-section bar to Main whenever we switch to a different top-level tab
      const subBar = document.getElementById('subbar-' + tabId);
      if (subBar && !subTabState[tabId]) {
        subBar.querySelectorAll('.pssb').forEach(b => b.classList.toggle('active', b.dataset.sub === '__main__'));
      }

      const cards = panel.querySelectorAll('.card');
      // Only animate first PAGE_SIZE cards to avoid jank
      const toAnimate = Array.from(cards).slice(0, PAGE_SIZE);
      gsap.fromTo(toAnimate,{y:20,opacity:0},{y:0,opacity:1,duration:.35,ease:'power2.out',stagger:.05});
      document.getElementById('hub').scrollIntoView({behavior:'smooth',block:'start'});
      updateLoadBtn();
    }

    document.getElementById('polConfirm').addEventListener('click', () => {
      polConfirmed = true;
      document.getElementById('polModal').classList.remove('show');
      switchTab('political');
    });
    document.getElementById('polCancel').addEventListener('click', () => {
      document.getElementById('polModal').classList.remove('show');
    });
    // Load More button hidden — auto-load via IntersectionObserver sentinel

    /* GAME MODAL */
    function openGame(url, title) {
      if (!url) return;
      document.getElementById('gameFrame').src = url;
      document.getElementById('gameModalTitle').textContent = title || 'Game';
      document.getElementById('gameModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeGame() {
      document.getElementById('gameModal').classList.remove('show');
      document.getElementById('gameFrame').src = '';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGame(); });

    /* ══ SCROLL VELOCITY SYSTEM
       Measures pixels/ms. Above threshold → body.fast-scroll class added,
       disabling hover effects and pointer events on cards so GPU stays cool.
       Resets 120ms after scroll stops. ══ */
    (function(){
      let lastY = window.scrollY;
      let lastT = performance.now();
      let fastTimer = null;
      const THRESHOLD = 1.8; // px/ms — tune down to be more aggressive

      window.addEventListener('scroll', () => {
        const nowY = window.scrollY;
        const nowT = performance.now();
        const dt = nowT - lastT;
        if (dt > 0) {
          const velocity = Math.abs(nowY - lastY) / dt;
          if (velocity > THRESHOLD) {
            document.body.classList.add('fast-scroll');
          }
        }
        lastY = nowY;
        lastT = nowT;
        clearTimeout(fastTimer);
        fastTimer = setTimeout(() => {
          document.body.classList.remove('fast-scroll');
        }, 120);
      }, { passive: true });
    })();

    /* CURSOR — desktop only, fully skipped on touch devices */
    const cur = document.getElementById('cur');
    const crg = document.getElementById('curRing');
    const isTouch = window.matchMedia('(hover:none) and (pointer:coarse)').matches
                 || ('ontouchstart' in window && navigator.maxTouchPoints > 0);

    if (!isTouch) {
      // Apply cursor:none only on desktop — CSS stays neutral for mobile
      document.body.style.cursor = 'none';
      document.querySelectorAll('.card,.htab,.card-cta,.load-btn,.pol-confirm,.pol-cancel,.game-modal-close,.game-modal-fullscreen').forEach(el => el.style.cursor = 'none');
      // Re-apply on dynamic cards added later via MutationObserver
      new MutationObserver(muts => {
        muts.forEach(m => m.addedNodes.forEach(n => {
          if (n.nodeType !== 1) return;
          if (n.classList?.contains('card')) n.style.cursor = 'none';
          n.querySelectorAll?.('.card,.card-cta').forEach(el => el.style.cursor = 'none');
        }));
      }).observe(document.getElementById('panelsContainer') || document.body, {childList:true, subtree:true});

      let mx = window.innerWidth / 2, my = window.innerHeight / 2;
      let rx = mx, ry = my;

      document.addEventListener('mousemove', e => {
        mx = e.clientX; my = e.clientY;
        cur.style.transform = 'translate3d(' + (mx - 5) + 'px,' + (my - 5) + 'px,0)';
      }, { passive: true });

      (function ring() {
        rx += (mx - rx) * .25;
        ry += (my - ry) * .25;
        crg.style.transform = 'translate3d(' + (rx - 18) + 'px,' + (ry - 18) + 'px,0)';
        requestAnimationFrame(ring);
      })();
    }

    gsap.to('.krz-wordmark .ac',{textShadow:'0 0 36px var(--mint),0 0 80px var(--mint-glow)',duration:2.2,ease:'power2.inOut',repeat:-1,yoyo:true});

    /* INIT */
    (async () => {
      try {
        const ok = await loadFeeds();
        if (!ok) return;
        // For legacy feeds.json: strip _theme and apply it
        if (FEEDS._theme) { applyTheme(FEEDS._theme); delete FEEDS._theme; }
        // Strip any non-section keys
        Object.keys(FEEDS).forEach(k => {
          if (!FEEDS[k] || !Array.isArray(FEEDS[k].cards)) delete FEEDS[k];
        });
        buildUI();
      } catch(e) {
        console.error('[KRITZAAR] Init error:', e);
      }
      // Always dismiss overlay — even if something above threw
      // Hard failsafe: clears overlay after 6s no matter what
      setTimeout(() => { try { const o=document.getElementById('loadingOverlay'); if(o){o.classList.add('fade');setTimeout(()=>o.remove(),700);} } catch(_){} }, 6000);
      setTimeout(() => {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
          overlay.classList.add('fade');
          setTimeout(() => { try { overlay.remove(); } catch(_){} }, 700);
        }
        try {
          const firstTab = Object.keys(FEEDS)[0];
          if (firstTab) {
            const initCards = Array.from(document.querySelectorAll('#panel-'+firstTab+' .card')).slice(0, PAGE_SIZE);
            gsap.from(initCards, {y:20,opacity:0,duration:.4,ease:'power2.out',stagger:.05,delay:.1});
          }
        } catch(_) {}
      }, 800);
    })();
  </script>
</body>
